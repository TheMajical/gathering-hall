services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - gamehub-data:/data
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  cloudflared:
    image: cloudflare/cloudflared:latest
    # http2 (TCP 443) instead of QUIC — UDP 7844 is blocked on many home networks
    command: tunnel --no-autoupdate --protocol http2 --url http://app:8080
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  gamehub-data:
